<head>

  .nf h1 em{font-style:normal;color:var(--green-hi)}
  .nf p{color:var(--muted);max-width:440px;margin:16px auto 30px}
  .nf .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body class="ready">
<main class="nf">
  <div>
    <img src="/img/escudo-sm.png" alt="Escudo del Club Atlético Monteverde" width="110" height="107">

    <div class="acts">

  </div>
